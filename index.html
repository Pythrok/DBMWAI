<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBMWAI - Discord Bot Maker With AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar" id="mainSidebar">
        <div class="logo">DBMWAI</div>
        <nav>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active" data-section="home">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="projects">Projects</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="config">Config</a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="sidebar" id="projectSidebar" style="display: none;">
        <div class="project-header">
            <button class="back-btn" id="backToProjects">&lt;</button>
            <div class="project-title" id="currentProjectName"></div>
        </div>
        <nav>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active" data-section="project-main">Main</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-section="project-config">Config</a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="main-content">
        <div id="home-section" class="content-section">
            <h1 class="section-title">Discord Bot Maker With AI</h1>
            <p class="section-subtitle" id="random-phrase">Loading...</p>
        </div>

        <div id="projects-section" class="content-section" style="display: none;">
            <h1 class="section-title">Projects</h1>
            <div class="projects-container">
                <div class="create-project-card" id="createProjectCard">
                    <div class="create-project-content">
                        <span>Create a project</span>
                    </div>
                </div>
                <div id="projectsList" class="projects-list"></div>
            </div>
        </div>

        <div id="config-section" class="content-section" style="display: none;">
            <h1 class="section-title">Config</h1>
            <form id="config-form" class="config-form">
                <div class="input-group">
                    <label for="apiUrl">API URL</label>
                    <input type="text" id="apiUrl" placeholder="Your API URL">
                </div>
                <div class="input-group">
                    <label for="apiKey">API KEY</label>
                    <input type="text" id="apiKey" placeholder="Your API KEY" class="api-key-input">
                </div>
                <div class="input-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" placeholder="Model name">
                </div>
                
                <div class="separator">
                    <span>Advanced</span>
                </div>
                
                <div class="input-group">
                    <label for="prompt">Prompt</label>
                    <select id="prompt">
                        <option value="default">default</option>
                    </select>
                </div>
                
                <button type="submit" class="btn primary save-btn">Save Configuration</button>
            </form>
        </div>

        <div id="project-main-section" class="content-section" style="display: none;">
            <h1 class="section-title">Ask for things</h1>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <input type="text" id="chatInput" placeholder="What would you like to add to your bot?" class="chat-input">
                    <button id="sendMessage" class="btn primary send-btn">Send</button>
                </div>
            </div>
        </div>

        <div id="project-config-section" class="content-section" style="display: none;">
            <h1 class="section-title">Project Config</h1>
            <form id="project-config-form" class="config-form">
                <div class="input-group">
                    <label for="projectConfigAuthor">Project Author</label>
                    <input type="text" id="projectConfigAuthor" required>
                </div>
                <div class="input-group">
                    <label for="projectConfigToken">Discord Bot Token</label>
                    <input type="text" id="projectConfigToken" placeholder="Your bot token" class="api-key-input" required>
                </div>
                <div class="input-group">
                    <label for="projectConfigBotId">Discord Bot ID</label>
                    <input type="text" id="projectConfigBotId" placeholder="Your bot ID" required>
                </div>
                
                <button type="submit" class="btn primary save-btn">Save Project Configuration</button>
            </form>
        </div>
    </div>

    <div id="createProjectModal" class="modal">
        <div class="modal-content">
            <h2>Create Project</h2>
            <form id="createProjectForm">
                <div class="input-group">
                    <label for="projectName">Project name</label>
                    <input type="text" id="projectName" required>
                </div>
                <div class="input-group">
                    <label for="projectDescription">Project Description</label>
                    <input type="text" id="projectDescription" required>
                </div>
                <div class="input-group">
                    <label for="projectAuthor">Project Author</label>
                    <input type="text" id="projectAuthor" required>
                </div>
                
                <div class="separator">
                    <span>Configuration</span>
                </div>
                
                <div class="input-group">
                    <label for="botToken">Discord Bot Token</label>
                    <input type="text" id="botToken" placeholder="Your bot token" required>
                </div>
                <div class="input-group">
                    <label for="botId">Discord Bot ID</label>
                    <input type="text" id="botId" placeholder="Your bot ID" required>
                </div>
                
                <div class="modal-buttons">
                    <button type="submit" class="btn primary">Create</button>
                    <button type="button" class="btn secondary" id="cancelProjectBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
